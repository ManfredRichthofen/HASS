[package]
name = "app"
version = "0.1.0"
description = "Casa Home Assistant dashboard"
authors = ["Casa"]
license = ""
repository = "https://github.com/ManfredRichthofen/HASS"
edition = "2024"
rust-version = "1.90"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.4", features = [] }
tauri-plugin-log = "2"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-geolocation = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# zip feature disabled: crates.io yanked all zip ^4; NSIS updater artifacts still work.
tauri-plugin-updater = { version = "2.14", default-features = false, features = ["rustls-tls", "system-proxy"] }
tauri-plugin-process = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
