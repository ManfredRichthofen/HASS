name: Android APK release

on:
  push:
    tags:
      - 'app-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-android:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      NDK_VERSION: 28.2.13676358
      # Baked into the bundle at build time; .env is gitignored so CI needs it explicitly.
      VITE_HA_URL: ${{ vars.VITE_HA_URL || secrets.VITE_HA_URL }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Cache Android NDK
        id: ndk-cache
        uses: actions/cache@v6
        with:
          path: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}
          key: ndk-${{ env.NDK_VERSION }}

      - name: Install NDK
        if: steps.ndk-cache.outputs.cache-hit != 'true'
        run: sdkmanager "ndk;${{ env.NDK_VERSION }}"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.x

      - name: Cache bun install
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          shared-key: android-aarch64

      - name: Require VITE_HA_URL
        run: |
          if [ -z "$VITE_HA_URL" ]; then
            echo "::error::VITE_HA_URL is empty. Add it under Settings > Secrets and variables > Actions (Variables or Secrets)."
            exit 1
          fi

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Patch Android location plugin
        run: bun run android:patch

      - name: Setup Android signing
        run: |
          if [ -z "$ANDROID_KEY_BASE64" ]; then
            echo "::error::ANDROID_KEY_BASE64 is not set. Releases must be signed with one stable key or in-app updates cannot install over the previous APK."
            exit 1
          fi
          cd src-tauri/gen/android
          echo "keyAlias=$ANDROID_KEY_ALIAS" > keystore.properties
          echo "password=$ANDROID_KEY_PASSWORD" >> keystore.properties
          echo "$ANDROID_KEY_BASE64" | base64 -d > "$RUNNER_TEMP/keystore.jks"
          echo "storeFile=$RUNNER_TEMP/keystore.jks" >> keystore.properties

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}
        with:
          mobile: android
          tauriScript: bun run tauri
          args: --apk --target aarch64
          tagName: app-v__VERSION__
          releaseName: 'Casa v__VERSION__'
          releaseBody: 'Android APK for Casa. Sideload the .apk asset below.'
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: false
